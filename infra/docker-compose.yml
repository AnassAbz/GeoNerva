# Local development infrastructure.
#   pnpm db:up     start PostGIS and wait until it is healthy
#   pnpm db:check  verify connectivity and required extensions
#   pnpm db:down   stop it (data persists in the named volume)
#
# Credentials here are for local development only and are not secrets.
# Supabase ships PostGIS 3.3.7 on Postgres 17 (docs/DATA_SOURCES.md V8). No 17-3.3 image is
# published, so local development and CI use the closest available tag (17-3.4) and migrations
# must stay within PostGIS 3.3 features (ADR-031).

name: geonerva

services:
  db:
    image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
    environment:
      POSTGRES_DB: geonerva
      POSTGRES_USER: geonerva
      POSTGRES_PASSWORD: geonerva
    ports:
      - '127.0.0.1:54320:5432'
    volumes:
      - geonerva-db:/var/lib/postgresql/data
    # TCP check on purpose: the image's first-boot init server only listens on the unix socket,
    # so a socket-based check reports "healthy" before the real server accepts connections.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U geonerva -d geonerva']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  geonerva-db:
