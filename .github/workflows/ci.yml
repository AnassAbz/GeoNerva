name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

# Third-party actions are pinned to full commit SHAs (supply-chain hardening, docs/SECURITY.md M8).
jobs:
  static:
    name: Typecheck · lint · format · architecture · unit · components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm test:unit
      - run: pnpm test:components
      # Fixture integrity: re-hashes every captured provider payload (no dependencies).
      - run: node scripts/capture-fixtures/verify-manifests.mjs

  integration:
    name: Integration (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
        env:
          POSTGRES_DB: geonerva
          POSTGRES_USER: geonerva
          POSTGRES_PASSWORD: geonerva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U geonerva -d geonerva"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL_WORKER: postgresql://geonerva:geonerva@127.0.0.1:5432/geonerva
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - run: pnpm test:integration

  build-e2e:
    name: Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pnpm test:e2e` seeds a scenario database and starts a production server against it
    # (apps/web/playwright.config.ts). This job declared neither, so it could only ever have
    # failed at the seed step — and it had never run on a hosted runner to say so (E-1).
    services:
      postgis:
        image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
        env:
          POSTGRES_DB: geonerva
          POSTGRES_USER: geonerva
          POSTGRES_PASSWORD: geonerva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U geonerva -d geonerva"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # The seeder creates and migrates this database itself; it only has to be loopback and named
      # `*_test`, which its own guard enforces (F-6). Set explicitly rather than relying on the
      # default, whose port 54320 belongs to the local compose file and exists on no runner.
      GEONERVA_E2E_DATABASE_URL: postgresql://geonerva:geonerva@127.0.0.1:5432/geonerva_e2e_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production build with canary secrets; fails if any reaches client bundles (SECURITY.md C2).
      - run: pnpm build:canary
      - run: pnpm --filter @geonerva/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    name: Secrets · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Report-only until v1 hardening (docs/IMPLEMENTATION_PLAN.md P1); findings are reviewed manually.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
