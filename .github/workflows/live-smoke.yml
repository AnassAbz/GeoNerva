# The nightly check that the deployment is still telling the truth (docs/TESTING.md §9 and §10).
#
# §9 names this file, and until P10 it did not exist. It runs `scripts/smoke.ts` — nine checks over
# HTTP, no database, no writes — against whatever `GEONERVA_SMOKE_URL` points at, and reports the
# soak rate alongside it when a read-only database URL is available.
#
# Third-party actions are pinned to full commit SHAs (supply-chain hardening, docs/SECURITY.md M8).
name: Live smoke

on:
  schedule:
    # 06:10 UTC: after the nightly ingestion window, and off the hour, because the hour is when
    # every scheduled workflow on the platform starts at once.
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to smoke (defaults to the GEONERVA_SMOKE_URL variable)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A *sentinel*, not the secret. A step-level `if` cannot read the `secrets` context but can
      # read `env`, and the obvious shortcut — lifting the secret itself to job scope — would put a
      # production database URL in the environment of every step, including `pnpm install` and any
      # postinstall script it runs. The boolean says whether the secret exists; the secret itself
      # appears only in the one step that uses it.
      HAS_SOAK_DATABASE: ${{ secrets.GEONERVA_SOAK_DATABASE_URL != '' }}
    # A repository with no deployment yet should not have a red nightly cron. The step below skips
    # cleanly when the URL is unset, rather than failing to describe a deployment that is not there.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # `--ignore-scripts`, as the worker image does: nothing here needs a postinstall to run,
      # and a scheduled job on a public repository is a poor place to execute one.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve the target
        id: target
        env:
          INPUT_URL: ${{ inputs.url }}
          VARIABLE_URL: ${{ vars.GEONERVA_SMOKE_URL }}
        run: |
          url="${INPUT_URL:-$VARIABLE_URL}"
          if [ -z "$url" ]; then
            echo "No GEONERVA_SMOKE_URL set and no url input given; nothing to smoke." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The dispatch API accepts any string, newlines included, and `$GITHUB_OUTPUT` is a
          # newline-delimited file: an unvalidated value can write step outputs of its own. A URL
          # has no whitespace in it, so anything that does is refused here rather than obeyed.
          case "$url" in
            *[![:graph:]]*) echo "the url must not contain whitespace" >&2; exit 1 ;;
            http://*|https://*) ;;
            *) echo "the url must be http(s)" >&2; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Through the environment, not through `${{ }}` inside `run:`. The URL originates in a
      # workflow_dispatch input, which GitHub expands into the script before bash sees it.
      - name: Smoke (docs/TESTING.md §10)
        if: steps.target.outputs.skip != 'true'
        env:
          SMOKE_URL: ${{ steps.target.outputs.url }}
        run: pnpm smoke "$SMOKE_URL"

      # The soak rate needs a database connection, which a public repository's scheduled job should
      # only have if the owner deliberately gave it one. Skipped when the secret is absent, and
      # never fatal: the smoke is the check, this is the context around it.
      - name: Soak rate over the last 24 h
        if: steps.target.outputs.skip != 'true' && env.HAS_SOAK_DATABASE == 'true'
        continue-on-error: true
        env:
          DATABASE_URL_WORKER: ${{ secrets.GEONERVA_SOAK_DATABASE_URL }}
        run: pnpm soak --hours 24
