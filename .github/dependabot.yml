# Dependency update proposals (docs/SECURITY.md M8). Updates are grouped to keep review load low;
# pnpm's minimumReleaseAge still applies when a proposed version is installed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: monthly
